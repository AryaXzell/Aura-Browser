name: Generate Release Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate keystore
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$STORE_PASSWORD" ] || [ "${#STORE_PASSWORD}" -lt 6 ]; then
            echo "::error::STORE_PASSWORD must be at least 6 characters"
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ] || [ "${#KEY_PASSWORD}" -lt 6 ]; then
            echo "::error::KEY_PASSWORD must be at least 6 characters"
            exit 1
          fi

          keytool -genkeypair \
            -v \
            -keystore my-upload-key.jks \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -alias upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Aura Browser, O=Aura Browser, C=ID"

      - name: Encode keystore
        run: |
          base64 -w 0 my-upload-key.jks > keystore.base64

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-keystore
          path: keystore.base64
