name: Generate Release Keystore

# CATATAN PENTING (dibaca sebelum menjalankan workflow ini):
# Workflow ini HANYA untuk membuat RELEASE keystore (dipakai saat assembleRelease
# dijalankan untuk distribusi resmi/Play Store di masa depan) — BUKAN untuk debug
# build yang dipakai sehari-hari (lihat build.yml, yang memakai debug keystore
# terpisah, di-restore dari secret DEBUG_KEYSTORE_BASE64).
#
# JALANKAN WORKFLOW INI HANYA SEKALI seumur hidup project (kecuali sengaja ingin
# mengganti release key, yang akan membuat APK release tidak bisa lagi meng-update
# instalasi dari release key sebelumnya). Setelah workflow selesai:
#   1. Download artifact "generated-keystore" dari halaman run workflow ini.
#   2. Buka isi file keystore.base64, salin seluruh isinya.
#   3. Buka repository Settings -> Secrets and variables -> Actions.
#   4. Buat secret baru bernama RELEASE_KEYSTORE_BASE64, isi dengan hasil salin di atas.
#   5. Simpan juga STORE_PASSWORD dan KEY_PASSWORD yang dipakai saat men-generate
#      sebagai secret terpisah dengan nama yang sama (jika belum ada).
#   6. Setelah semua secret tersimpan, HAPUS artifact "generated-keystore" dari
#      halaman Actions (klik ikon tempat sampah) - jangan biarkan keystore
#      tersimpan dalam bentuk artifact yang bisa kedaluwarsa/diakses lebih lama
#      dari yang perlu.

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate keystore
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$STORE_PASSWORD" ] || [ "${#STORE_PASSWORD}" -lt 6 ]; then
            echo "::error::STORE_PASSWORD must be at least 6 characters"
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ] || [ "${#KEY_PASSWORD}" -lt 6 ]; then
            echo "::error::KEY_PASSWORD must be at least 6 characters"
            exit 1
          fi

          keytool -genkeypair \
            -v \
            -keystore my-upload-key.jks \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -alias upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Aura Browser, O=Aura Browser, C=ID"

      - name: Encode keystore
        run: |
          base64 -w 0 my-upload-key.jks > keystore.base64

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-keystore
          path: keystore.base64
