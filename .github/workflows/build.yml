name: Android CI Build

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "**" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Package APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Restore persistent debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::Secret DEBUG_KEYSTORE_BASE64 belum di-set. Setiap build akan menghasilkan APK dengan signature berbeda, menyebabkan Android menolak instalasi update tanpa uninstall dulu. Lihat dokumentasi PRD untuk langkah setup."
            exit 1
          fi
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
          echo "Debug keystore berhasil di-restore ke ~/.android/debug.keystore"

      - name: Restore persistent release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::Secret RELEASE_KEYSTORE_BASE64 belum di-set. Lihat dokumentasi PRD/generate-keystore.yml untuk langkah setup release keystore."
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > aura-browser-release.jks
          echo "Release keystore berhasil di-restore ke aura-browser-release.jks"

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Assemble Split and Universal Debug APKs
        run: ./gradlew assembleDebug -PsplitApks --no-daemon --stacktrace

      - name: Assemble Split and Universal Release APKs
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease -PsplitApks --no-daemon --stacktrace

      - name: Upload ARM64 (64-bit) Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: aura-browser-arm64-v8a
          path: app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload ARM32 (32-bit) Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: aura-browser-armeabi-v7a-32bit
          path: app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Universal Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: aura-browser-universal
          path: app/build/outputs/apk/debug/app-universal-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload ARM64 (64-bit) Release APK
        uses: actions/upload-artifact@v4
        with:
          name: aura-browser-arm64-v8a-release
          path: app/build/outputs/apk/release/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload ARM32 (32-bit) Release APK
        uses: actions/upload-artifact@v4
        with:
          name: aura-browser-armeabi-v7a-32bit-release
          path: app/build/outputs/apk/release/app-armeabi-v7a-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Universal Release APK
        uses: actions/upload-artifact@v4
        with:
          name: aura-browser-universal-release
          path: app/build/outputs/apk/release/app-universal-release.apk
          if-no-files-found: error
          retention-days: 14
