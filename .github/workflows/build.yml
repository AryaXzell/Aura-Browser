name: Android CI Build

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "**" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Restore persistent release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::Secret RELEASE_KEYSTORE_BASE64 belum di-set. Lihat dokumentasi PRD/generate-keystore.yml untuk langkah setup release keystore."
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > aura-browser-release.jks
          echo "Release keystore berhasil di-restore ke aura-browser-release.jks"

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Assemble Split and Universal Release APKs
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease -PsplitApks --no-daemon --stacktrace

      - name: Upload ARM64 (64-bit) Release APK
        uses: actions/upload-artifact@v4
        with:
          name: aura-browser-arm64-v8a-release
          path: app/build/outputs/apk/release/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload ARM32 (32-bit) Release APK
        uses: actions/upload-artifact@v4
        with:
          name: aura-browser-armeabi-v7a-32bit-release
          path: app/build/outputs/apk/release/app-armeabi-v7a-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Universal Release APK
        uses: actions/upload-artifact@v4
        with:
          name: aura-browser-universal-release
          path: app/build/outputs/apk/release/app-universal-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish Direct Release APKs (for in-app bypass download)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Hapus rilis continuous lama jika ada agar artefak APK selalu mutakhir
          gh release delete continuous --yes --cleanup-tag || true
          git tag -d continuous || true
          git push origin :refs/tags/continuous || true

          # Buat rilis continuous baru dengan APK rilis per arsitektur
          gh release create continuous \
            app/build/outputs/apk/release/app-arm64-v8a-release.apk#app-arm64-v8a-release.apk \
            app/build/outputs/apk/release/app-armeabi-v7a-release.apk#app-armeabi-v7a-release.apk \
            app/build/outputs/apk/release/app-universal-release.apk#app-universal-release.apk \
            --title "Aura Browser Continuous Build #${{ github.run_number }}" \
            --notes "Continuous build automatically compiled from commit ${{ github.sha }} (Workflow Run #${{ github.run_number }})." \
            --latest=true || \
          gh release upload continuous \
            app/build/outputs/apk/release/app-arm64-v8a-release.apk#app-arm64-v8a-release.apk \
            app/build/outputs/apk/release/app-armeabi-v7a-release.apk#app-armeabi-v7a-release.apk \
            app/build/outputs/apk/release/app-universal-release.apk#app-universal-release.apk \
            --clobber
