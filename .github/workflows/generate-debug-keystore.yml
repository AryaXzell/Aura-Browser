name: Generate Persistent Debug Keystore

# CATATAN: Jalankan workflow ini jika Anda tidak punya komputer!
# Alur kerja:
# 1. Jalankan workflow ini secara manual dari tab "Actions" di browser HP Anda.
# 2. Setelah selesai, buka log dari run tersebut di bagian "Generate and Encode Keystore".
# 3. Salin (copy) teks base64 yang dicetak di log.
# 4. Tempel (paste) teks tersebut ke GitHub Secrets sebagai DEBUG_KEYSTORE_BASE64.

on:
  workflow_dispatch:

jobs:
  generate-debug:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate and Encode Keystore
        run: |
          echo "=== MEMULAI GENERATE DEBUG KEYSTORE ==="
          keytool -genkeypair \
            -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          
          echo "=== BERHASIL GENERATE ==="
          echo ""
          echo "=== SALIN TEKS BASE64 DI BAWAH INI ==="
          base64 -w 0 debug.keystore
          echo ""
          echo "=== SELESAI ==="

      - name: Encode keystore to file for artifact
        run: |
          base64 -w 0 debug.keystore > debug_keystore.base64

      - name: Upload Keystore Artifact (Opsional)
        uses: actions/upload-artifact@v4
        with:
          name: persistent-debug-keystore
          path: debug_keystore.base64
